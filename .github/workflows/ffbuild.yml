# Builds the multistream runtime bundle: a minimal remux-only ffmpeg (built
# from source) plus mediamtx (built from a pinned commit), packaged per
# platform and published to a dedicated "runtime-v*" GitHub release. The npm
# postinstall (npm/install.js) downloads the current platform's bundle from
# that release, so multistream users get ffmpeg + mediamtx without any
# separate installation.
#
# Run manually (workflow_dispatch) when an upstream version bump is wanted.
name: ffbuild

on:
  # Tag push triggers the build with the default (pinned) versions, which
  # also makes the build reproducible from git alone.
  push:
    tags: ['runtime-v*']
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: "ffmpeg version to build"
        default: "9.0"
      src_sha256:
        description: "sha256 of the ffmpeg-<version>.tar.xz source tarball"
        default: "7f607a00dd0d28a729d5a4811205812eef01cf6ef6155025febb6f36a9062d52"
      mediamtx_version:
        description: "mediamtx git tag"
        default: "v1.20.1"
      mediamtx_commit:
        description: "commit the mediamtx tag must resolve to"
        default: "883194a19b7244355c9bc975c0574c9842733637"
      runtime_tag:
        description: "GitHub release tag for the bundle (bump per release)"
        default: "runtime-v1"

permissions:
  contents: write

# Tag-triggered runs have no workflow inputs, so every value falls back to
# its default (keep these in sync with the input defaults above).
env:
  FFMPEG_VERSION: ${{ inputs.ffmpeg_version || '9.0' }}
  SRC_SHA256: ${{ inputs.src_sha256 || '7f607a00dd0d28a729d5a4811205812eef01cf6ef6155025febb6f36a9062d52' }}
  MEDIAMTX_VERSION: ${{ inputs.mediamtx_version || 'v1.20.1' }}
  MEDIAMTX_COMMIT: ${{ inputs.mediamtx_commit || '883194a19b7244355c9bc975c0574c9842733637' }}
  RUNTIME_TAG: ${{ inputs.runtime_tag || 'runtime-v1' }}

jobs:
  ffmpeg-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Register QEMU for cross-arch builds
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64
      - name: Build linux/amd64 and linux/arm64 (musl, static)
        run: |
          source ffbuild/fail-annotate.sh
          for p in amd64 arm64; do
            docker buildx build --platform linux/$p \
              --build-arg SRC_SHA256="${SRC_SHA256}" \
              -f ffbuild/Dockerfile.linux -t ffbuild:linux_$p --load ffbuild/ \
              > "build-linux_$p.log" 2>&1 || {
                report_build_failure "docker build linux/$p failed" "build-linux_$p.log"
                exit 1
              }
            tail -n 5 "build-linux_$p.log"
            mkdir -p "dist/linux_$p"
            docker run --rm -v "$PWD/dist/linux_$p:/dest" ffbuild:linux_$p \
              sh -c 'mkdir -p /dest && cp /out/ffmpeg /dest/ffmpeg'
          done
          ls -lh dist/linux_*/ffmpeg
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux
          path: dist/linux_*/ffmpeg
          if-no-files-found: error

  ffmpeg-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw-w64 cross toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64
          # There is no aarch64 mingw port in Ubuntu; degrade to shipping
          # without windows/arm64 instead of failing the bundle (users can
          # install ffmpeg + mediamtx system-wide there).
          if ! sudo apt-get install -y --no-install-recommends gcc-mingw-w64-aarch64; then
            echo "aarch64 mingw toolchain unavailable; skipping windows/arm64"
            echo "SKIP_ARM64=1" >> "$GITHUB_ENV"
          fi
      - name: Build windows/amd64 and windows/arm64
        run: |
          source ffbuild/fail-annotate.sh
          export TARGET_OS=windows SRCDIR="$PWD/src-win"
          mkdir -p "$SRCDIR"
          FFMPEG_ARCH=x86_64 CROSS_PREFIX=x86_64-w64-mingw32- \
            OUTDIR=dist/windows_amd64 OUTNAME=ffmpeg.exe \
            bash ffbuild/build-ffmpeg.sh > build-win-amd64.log 2>&1 || {
              report_build_failure "ffmpeg windows/amd64 build failed" build-win-amd64.log
              exit 1
            }
          tail -n 3 build-win-amd64.log
          if [ -z "${SKIP_ARM64:-}" ]; then
            FFMPEG_ARCH=aarch64 CROSS_PREFIX=aarch64-w64-mingw32- \
              OUTDIR=dist/windows_arm64 OUTNAME=ffmpeg.exe \
              bash ffbuild/build-ffmpeg.sh > build-win-arm64.log 2>&1 || {
                report_build_failure "ffmpeg windows/arm64 build failed" build-win-arm64.log
                exit 1
              }
            tail -n 3 build-win-arm64.log
          fi
          ls -lh dist/windows_*/ffmpeg.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows
          path: dist/windows_*/ffmpeg.exe
          if-no-files-found: error

  ffmpeg-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build darwin/arm64 (native)
        env:
          TARGET_OS: macosx
          OUTDIR: dist/darwin_arm64
          OUTNAME: ffmpeg
          SRCDIR: ${{ github.workspace }}/src-darwin-arm64
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          source ffbuild/fail-annotate.sh
          bash ffbuild/build-ffmpeg.sh > build-darwin-arm64.log 2>&1 || {
            report_build_failure "ffmpeg darwin/arm64 build failed" build-darwin-arm64.log
            exit 1
          }
          tail -n 3 build-darwin-arm64.log
      - name: Build darwin/amd64 (cross on the arm64 runner)
        env:
          TARGET_OS: macosx
          OUTDIR: dist/darwin_amd64
          OUTNAME: ffmpeg
          SRCDIR: ${{ github.workspace }}/src-darwin-amd64
          CC: "clang -arch x86_64"
          MACOSX_DEPLOYMENT_TARGET: "10.15"
        run: |
          source ffbuild/fail-annotate.sh
          bash ffbuild/build-ffmpeg.sh > build-darwin-amd64.log 2>&1 || {
            report_build_failure "ffmpeg darwin/amd64 build failed" build-darwin-amd64.log
            exit 1
          }
          tail -n 3 build-darwin-amd64.log
      - name: Show results
        run: |
          ls -lh dist/darwin_*/ffmpeg
          file dist/darwin_*/ffmpeg
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-darwin
          path: dist/darwin_*/ffmpeg
          if-no-files-found: error

  mediamtx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build mediamtx for all six targets
        env:
          SRCDIR: ${{ github.workspace }}/mtx-src
          OUTDIR: dist
        run: |
          source ffbuild/fail-annotate.sh
          bash ffbuild/build-mediamtx.sh > build-medi-mtx.log 2>&1 || {
            report_build_failure "mediamtx build failed" build-medi-mtx.log
            exit 1
          }
          tail -n 5 build-medi-mtx.log
      - uses: actions/upload-artifact@v4
        with:
          name: mediamtx
          path: dist/mediamtx-*
          if-no-files-found: error

  smoke:
    runs-on: ubuntu-latest
    needs: [ffmpeg-linux, mediamtx]
    steps:
      - uses: actions/checkout@v4
      # Artifact entries are stored relative to the glob's base dir
      # (linux_amd64/ffmpeg, mediamtx-linux-amd64, ...), so extract into
      # dist/ to reconstruct the dist/... layout the test expects.
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-linux
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: mediamtx
          path: dist
      # The artifact round-trip drops the executable bit; restore it before
      # anything runs the downloaded binaries.
      - name: Restore executable bits
        run: |
          chmod +x dist/linux_amd64/ffmpeg dist/mediamtx-linux-amd64
      - name: Install ffprobe (verification only, not shipped)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Smoke test (away -> live remux, exactly the daemon's shape)
        run: |
          source ffbuild/fail-annotate.sh
          chmod +x ffbuild/smoke-test.sh
          ffbuild/smoke-test.sh dist/linux_amd64/ffmpeg \
            dist/mediamtx-linux-amd64 \
            test/data/sample.flv test/data/away.mp4 > smoke.log 2>&1 || {
            report_build_failure "smoke test failed" smoke.log
            exit 1
          }
          cat smoke.log

  bundle:
    runs-on: ubuntu-latest
    needs: [ffmpeg-linux, ffmpeg-windows, ffmpeg-darwin, mediamtx, smoke]
    steps:
      - uses: actions/checkout@v4
      # Artifact entries are stored relative to each glob's base dir
      # (linux_amd64/ffmpeg, darwin_arm64/ffmpeg, mediamtx-linux-amd64,
      # ...), so extract into dist/ to reconstruct the dist/... layout
      # the assembly loop expects.
      - uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: mediamtx
          path: dist
      - name: Assemble per-platform runtime bundles
        run: |
          set -euo pipefail
          # Artifact round-trips drop the executable bit; restore it so the
          # shipped tarballs carry executable binaries.
          chmod +x dist/linux_*/ffmpeg dist/darwin_*/ffmpeg \
            dist/windows_*/ffmpeg.exe dist/mediamtx-*
          missing=""
          for t in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64 windows_amd64 windows_arm64; do
            os="${t%_*}"; arch="${t#*_}"
            ext=""
            [ "$os" = windows ] && ext=".exe"
            if [ ! -f "dist/$t/ffmpeg$ext" ] || [ ! -f "dist/mediamtx-$os-$arch$ext" ]; then
              echo "WARNING: skipping $t (ffmpeg or mediamtx binary missing)"
              missing="$missing $t"
              continue
            fi
            d="rt/$t"; mkdir -p "$d/bin"
            cp "dist/$t/ffmpeg$ext" "$d/bin/ffmpeg$ext"
            cp "dist/mediamtx-$os-$arch$ext" "$d/bin/mediamtx$ext"
            cp ffbuild/LICENSE-ffmpeg.txt "$d/LICENSE-ffmpeg.txt"
            cp ffbuild/LICENSE-mediamtx.txt "$d/LICENSE-mediamtx.txt"
            {
              echo "ffmpeg=${FFMPEG_VERSION}"
              echo "mediamtx=${MEDIAMTX_VERSION}"
              echo "mediamtx_commit=${MEDIAMTX_COMMIT}"
              echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            } > "$d/VERSIONS"
            # Underscore before the target name: the SHA256SUMS globs and
            # npm's make-package.mjs expect multistream-runtime_<os>_<arch>.tar.gz
            tar -czf "multistream-runtime_${t}.tar.gz" -C rt "$t"
          done
          if [ -n "$missing" ]; then
            echo "Missing platforms:$missing" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Write SHA256SUMS
        run: |
          set -euo pipefail
          # No pipe: a glob that matches nothing must fail the step, not
          # produce an empty (and silently consumed) sums file.
          sha256sum multistream-runtime_*.tar.gz > SHA256SUMS-runtime.txt
          sort -o SHA256SUMS-runtime.txt SHA256SUMS-runtime.txt
          [ -s SHA256SUMS-runtime.txt ] || { echo "ERROR: no runtime tarballs found" >&2; exit 1; }
          cat SHA256SUMS-runtime.txt
      - name: Upload runtime release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source ffbuild/fail-annotate.sh
          tag="${RUNTIME_TAG}"
          {
            # A tag push auto-creates the release, but possibly as a DRAFT,
            # and 'gh release view' ignores drafts by default - so do not
            # branch on view; edit handles both states.
            if gh release view "$tag" >/dev/null 2>&1 \
              || gh release view "$tag" --draft >/dev/null 2>&1; then
              # Mark prerelease so it never becomes the "Latest release"
              # banner, and publish it in case the tag push left a draft.
              gh release edit "$tag" --prerelease
              gh release edit "$tag" --draft=false
            else
              gh release create "$tag" --prerelease \
                --title "Runtime bundle: ffmpeg + mediamtx" \
                --notes "Downloaded by the @arifyaman/multistream npm postinstall. Not for direct use."
            fi
            ls -lh multistream-runtime_*.tar.gz SHA256SUMS-runtime.txt
            gh release upload "$tag" multistream-runtime_*.tar.gz \
              SHA256SUMS-runtime.txt --clobber
          } > upload.log 2>&1 || {
            report_build_failure "runtime release upload failed" upload.log
            exit 1
          }
          cat upload.log
      - uses: actions/upload-artifact@v4
        with:
          name: runtime
          path: |
            multistream-runtime_*.tar.gz
            SHA256SUMS-runtime.txt
