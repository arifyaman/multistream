name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          version="${GITHUB_REF_NAME#v}"
          commit="${GITHUB_SHA::7}"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ext=""
          [ "$goos" = "windows" ] && ext=".exe"
          asset="multistream_${version}_${goos}_${goarch}"
          work="build/${asset}"
          mkdir -p "$work" sha256sums
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w \
              -X github.com/xlip/multistream/internal/version.Version=${version} \
              -X github.com/xlip/multistream/internal/version.Commit=${commit} \
              -X github.com/xlip/multistream/internal/version.Date=${date}" \
            -o "$work/multistream${ext}" ./cmd/multistream
          cp LICENSE README.md "$work/"
          mkdir -p dist
          tar -czf "dist/${asset}.tar.gz" "$work"
          mv "$work/multistream${ext}" "dist/${asset}${ext}"
          hash="$(sha256sum "dist/${asset}${ext}" | awk '{print $1}')"
          printf '%s  %s\n' "$hash" "${asset}${ext}" > "sha256sums/SHA256SUMS-${goos}_${goarch}.txt"
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: sha256sums
          path: sha256sums/*
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/multistream_*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gate:
    runs-on: ubuntu-latest
    outputs:
      npm: ${{ steps.check.outputs.npm }}
    steps:
      - id: check
        run: echo "npm=${{ secrets.NPM_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

  npm:
    runs-on: ubuntu-latest
    needs: [gate, release]
    if: needs.gate.outputs.npm == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          name: sha256sums
          path: sha256sums
      - name: Stage package
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p stage/bin
          cat sha256sums/SHA256SUMS-*.txt | sort > sha256sums/SHA256SUMS.txt
          node npm/make-package.mjs "$version" sha256sums/SHA256SUMS.txt \
            "${{ github.server_url }}/${{ github.repository }}/releases" \
            "${{ github.repository }}" > stage/package.json
          cp npm/install.js stage/install.js
          cp npm/bin/multistream.js stage/bin/multistream.js
          cp npm/README.md stage/README.md
      - name: Pack and publish
        run: |
          cd stage
          npm pack
          # Pre-release tags (vX.Y.Z-*) go to the "alpha" dist-tag so plain
          # "npm install" keeps resolving the latest stable version.
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            npm publish --access public --tag alpha
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
