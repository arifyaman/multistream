name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # Required for npm trusted publishing (OIDC identity, no token needed)
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          commit="${GITHUB_SHA::7}"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ "$GOOS" = "windows" ]; then ext=".exe"; else ext=""; fi
          asset="multistream_${version}_${GOOS}_${GOARCH}"
          work="build/${asset}"
          mkdir -p "$work" sha256sums
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w \
              -X github.com/xlip/multistream/internal/version.Version=${version} \
              -X github.com/xlip/multistream/internal/version.Commit=${commit} \
              -X github.com/xlip/multistream/internal/version.Date=${date}" \
            -o "$work/multistream${ext}" ./cmd/multistream
          cp LICENSE README.md "$work/"
           mkdir -p dist
           # -C build: the tarball's top-level dir must be the asset name,
           # not the build/ working prefix.
           tar -czf "dist/${asset}.tar.gz" -C build "${asset}"
          mv "$work/multistream${ext}" "dist/${asset}${ext}"
          hash="$(sha256sum "dist/${asset}${ext}" | awk '{print $1}')"
          printf '%s  %s\n' "$hash" "${asset}${ext}" > "sha256sums/SHA256SUMS-${GOOS}_${GOARCH}.txt"
      # Unique artifact names per platform: same-name uploads from parallel
      # matrix jobs do not reliably merge, so consumers download with
      # pattern + merge-multiple instead.
      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
      - name: Upload checksums
        uses: actions/upload-artifact@v7
        with:
          name: sha256sums-${{ matrix.goos }}_${{ matrix.goarch }}
          path: sha256sums/*
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    env:
      # The runtime bundle (ffmpeg + mediamtx) packed inside the
      # per-platform tarballs, so a manual install is a single file.
      # Bump when the ffbuild workflow publishes a new runtime-v* release.
      RUNTIME_TAG: runtime-v1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Fetch runtime bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$RUNTIME_TAG" \
            --pattern 'multistream-runtime_*.tar.gz' \
            --dir runtime
      - name: Build full-bundle tarballs
        # Each per-platform tarball becomes the complete, zero-dependency
        # install: app binary + bundled ffmpeg + mediamtx in one flat dir,
        # so putting the extracted folder on PATH is all a user has to do.
        # Platforms without a runtime (currently windows_arm64) keep the
        # app-only tarball.
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for rt in runtime/multistream-runtime_*.tar.gz; do
            t="$(basename "$rt" | sed -e 's/^multistream-runtime_//' -e 's/\.tar\.gz$//')"
            os="${t%_*}"; arch="${t#*_}"
            app="multistream_${version}_${os}_${arch}"
            rm -rf "work/$app" "work/$app-rt" && mkdir -p "work/$app" "work/$app-rt"
            tar -xzf "dist/${app}.tar.gz" -C "work/$app" --strip-components=1
            tar -xzf "$rt" -C "work/$app-rt" --strip-components=1
            mv "work/$app-rt/bin/"* "work/$app/"
            rmdir "work/$app-rt/bin"
            mv "work/$app-rt/"* "work/$app/"
            rm -rf "work/$app-rt"
            tar -czf "dist/${app}.tar.gz" -C work "$app"
          done
      - name: Write SHA256SUMS
        run: |
          set -euo pipefail
          sha256sum dist/multistream_* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Clear stale releases for this tag
        # Draft releases from aborted runs survive tag deletion and make
        # action-gh-release fail with "already_exists"; remove them first.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ids="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq "[.[] | select(.tag_name==\"${GITHUB_REF_NAME}\") | .id] | join(\" \")")"
          for id in $ids; do
            echo "Deleting stale release ${id}"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
          done
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/multistream_*
            SHA256SUMS.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm:
    runs-on: ubuntu-latest
    needs: release
    env:
      # The runtime bundle (ffmpeg + mediamtx) the npm postinstall downloads.
      # Bump here when the ffbuild workflow publishes a new runtime-v* release.
      RUNTIME_TAG: runtime-v1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v8
        with:
          pattern: sha256sums-*
          merge-multiple: true
          path: sha256sums
      - name: Fetch runtime checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p sha256sums-runtime
          if ! gh release download "$RUNTIME_TAG" --pattern 'SHA256SUMS-runtime.txt' --dir sha256sums-runtime; then
            echo "::error::runtime release '$RUNTIME_TAG' not found - run the ffbuild workflow (tag runtime-v*) before publishing"
            exit 1
          fi
      - name: Stage package
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p stage/bin
          cat sha256sums/SHA256SUMS-*.txt | sort > sha256sums/SHA256SUMS.txt
          node npm/make-package.mjs "$version" sha256sums/SHA256SUMS.txt \
            "${{ github.server_url }}/${{ github.repository }}/releases" \
            "${{ github.repository }}" \
            "$RUNTIME_TAG" sha256sums-runtime/SHA256SUMS-runtime.txt > stage/package.json
          cp npm/install.js stage/install.js
          cp npm/bin/multistream.js stage/bin/multistream.js
          cp npm/README.md stage/README.md
      - name: Pack and publish
        # Auth via npm trusted publishing (OIDC): no token, the runner's
        # identity is verified by npm against the trusted publisher config
        # (npmjs.com -> Publishing -> Trusted publishers). The publisher is
        # scoped to publish only - it cannot do registry reads or move
        # dist-tags, so the read below runs without it.
        run: |
          cd stage
          version="$(node -p "require('./package.json').version")"
          prerelease=0
          [[ "${GITHUB_REF_NAME}" == *-* ]] && prerelease=1
          # Idempotent: a re-run (or a manual publish) of an already-published
          # version must not fail the release.
          if NODE_AUTH_TOKEN= npm view "@arifyaman/multistream@${version}" version >/dev/null 2>&1; then
            echo "v${version} is already published on npm; skipping publish"
          else
            npm pack
            # Pre-release tags (vX.Y.Z-*) go to the "alpha" dist-tag so plain
            # "npm install" keeps resolving the latest stable version.
            # Dist-tags are deliberately NOT moved here: the trusted
            # publisher is publish-scoped only. A stable publish (no --tag)
            # sets "latest" by itself; while pre-1.0, moving "latest" to a
            # new alpha is a manual step:
            #   npm dist-tag add @arifyaman/multistream@<version> latest
            if [[ "${prerelease}" == 1 ]]; then
              npm publish --access public --provenance --tag alpha
            else
              npm publish --access public --provenance
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
