name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          commit="${GITHUB_SHA::7}"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ "$GOOS" = "windows" ]; then ext=".exe"; else ext=""; fi
          asset="multistream_${version}_${GOOS}_${GOARCH}"
          work="build/${asset}"
          mkdir -p "$work" sha256sums
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w \
              -X github.com/xlip/multistream/internal/version.Version=${version} \
              -X github.com/xlip/multistream/internal/version.Commit=${commit} \
              -X github.com/xlip/multistream/internal/version.Date=${date}" \
            -o "$work/multistream${ext}" ./cmd/multistream
          cp LICENSE README.md "$work/"
          mkdir -p dist
          tar -czf "dist/${asset}.tar.gz" "$work"
          mv "$work/multistream${ext}" "dist/${asset}${ext}"
          hash="$(sha256sum "dist/${asset}${ext}" | awk '{print $1}')"
          printf '%s  %s\n' "$hash" "${asset}${ext}" > "sha256sums/SHA256SUMS-${GOOS}_${GOARCH}.txt"
      # Unique artifact names per platform: same-name uploads from parallel
      # matrix jobs do not reliably merge, so consumers download with
      # pattern + merge-multiple instead.
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: sha256sums-${{ matrix.goos }}_${{ matrix.goarch }}
          path: sha256sums/*
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Clear stale releases for this tag
        # Draft releases from aborted runs survive tag deletion and make
        # action-gh-release fail with "already_exists"; remove them first.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ids="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq "[.[] | select(.tag_name==\"${GITHUB_REF_NAME}\") | .id] | join(\" \")")"
          for id in $ids; do
            echo "Deleting stale release ${id}"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/multistream_*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
