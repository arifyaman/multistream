name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: |
          # On failure, surface the tail as annotations (visible without
          # signing in to the Actions log).
          go test -race ./... > test.log 2>&1 || {
            echo "::error::go test failed; last lines:"
            tail -n 40 test.log | while IFS= read -r l; do echo "::error::  $l"; done
            exit 1
          }
          tail -n 20 test.log

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v1.59.1
          args: ./...
